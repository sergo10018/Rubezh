# Реестр фактов «Рубежа»
#
# Зачем: одно число или название часто встречается в нескольких документах и в коде.
# Реестр помнит, кто из них главный, и позволяет скиллу consistency-check найти расхождения.
#
# Правила:
# - Заносим только то, что встречается минимум в двух местах. Внутренние числа одной системы не нужны.
# - source — главный источник. При расхождении значением считается он, пока лид не решит иначе.
# - Канон (docs/01_Канон.md) главнее всех. data/*.csv главнее GDD по значениям предметов и лута.
# - referenced_by — где ещё факт встречается; это список того, что проверить при его изменении.
# - Записи не удаляем: ставим status: deprecated. При смене значения пишем revised и старое значение в note.
# - status: active | deprecated. Нерешённое расхождение описываем в conflict.
# - Реестр не решает за лида: геймдизайнерские правки делаются с его одобрения,
#   канон — только с записью в журнал изменений канона.

